<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>algO · Visualizador de ordenamiento</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F5F9;--ink:#10131F;--mute:#5B6178;--line:#D9DCE8;--card:#fff;--blue:#2340F0;--bar:#A9B8FF;--cmp:#FFD23F;--swp:#FF5A4E;--ok:#7CF2B8;--piv:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1017;--ink:#EEF0FA;--mute:#9AA0B8;--line:#252A3A;--card:#161927}}
:root[data-theme="dark"]{--paper:#0E1017;--ink:#EEF0FA;--mute:#9AA0B8;--line:#252A3A;--card:#161927}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
header{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:28px;letter-spacing:-.04em;display:flex;align-items:center;gap:2px}
.logo i{display:inline-flex;align-items:flex-end;gap:2px;width:26px;height:26px;border:3px solid var(--blue);border-radius:50%;padding:0 5px 4px;overflow:hidden}
.logo i b{flex:1;background:var(--blue);border-radius:1px}
header p{margin:0;color:var(--mute);font-size:14px;max-width:34ch;text-align:right}
main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:clamp(16px,3vw,40px);padding:clamp(16px,3vw,40px) clamp(16px,4vw,48px);max-width:1300px;margin:auto}
nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:16px}
nav h2{font-size:14px;font-weight:600;color:var(--mute);margin:0 0 6px}
.alg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:10px;border:1px solid transparent;font-weight:600}
.alg:hover{background:var(--card)}
.alg:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--cmp);outline-offset:2px}
.alg[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.alg small{font:500 12px 'IBM Plex Mono',monospace;opacity:.75}
.stage{background:var(--blue);border-radius:20px;padding:22px 22px 0;color:#fff;position:relative;overflow:hidden}
.stage h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stage .st{position:absolute;right:22px;top:24px;font:500 13px 'IBM Plex Mono',monospace;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:99px}
#bars{height:340px;display:flex;align-items:flex-end;gap:2px;margin-top:22px}
#bars div{flex:1;background:var(--bar);border-radius:2px 2px 0 0;transition:background .08s}
#bars .c{background:var(--cmp)}#bars .s{background:var(--swp)}#bars .o{background:var(--ok)}#bars .p{background:var(--piv)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;padding:14px 0 16px;opacity:.9}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
button.b{font:600 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;padding:11px 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
button.b:hover{background:var(--card)}
button.go{background:var(--blue);border-color:var(--blue);color:#fff;padding:11px 26px}
button.go:hover{background:var(--blue);filter:brightness(1.12)}
label{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mute)}
input[type=range]{accent-color:var(--blue);width:110px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:16px 0 16px 18px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:500 clamp(24px,3.5vw,38px)/1.1 'IBM Plex Mono',monospace}
.stats span{font-size:13px;color:var(--mute)}
.learn{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px)}
.learn h2{font-size:30px;margin:0 0 8px;letter-spacing:-.02em}
.learn p{max-width:60ch;margin:0 0 14px}
.tip{border-left:4px solid var(--blue);padding:4px 0 4px 14px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mute);font-size:13px}
td.m{font-family:'IBM Plex Mono',monospace;font-size:13px}
tr.on td{background:var(--card);font-weight:600}
.g{color:#0E9F5B}.a{color:#C77800}
footer{padding:28px clamp(16px,4vw,48px);border-top:1px solid var(--line);color:var(--mute);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:860px){main{grid-template-columns:1fr}nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}nav h2{display:none}.alg{white-space:nowrap;gap:8px}.learn{grid-template-columns:1fr}header p{display:none}#bars{height:260px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header><div class="logo">alg<i aria-hidden="true"><b style="height:40%"></b><b style="height:100%"></b><b style="height:65%"></b></i></div><p>Mira cómo ordena cada algoritmo, paso a paso.</p></header>
<main>
<nav aria-label="Algoritmos"><h2>Algoritmos</h2><div id="list" style="display:contents"></div></nav>
<section>
<div class="stage"><h1 id="title">Bubble Sort</h1><div class="st" id="status">Listo</div>
<div id="bars" role="img" aria-label="Barras del arreglo"></div>
<div class="legend"><span style="--c:var(--bar)">Sin tocar</span><span style="--c:var(--cmp)">Comparando</span><span style="--c:var(--swp)">Moviendo</span><span style="--c:var(--piv)">Pivote</span><span style="--c:var(--ok)">Ordenado</span></div></div>
<div class="tools">
<button class="b go" id="run">Ordenar</button><button class="b" id="stop" hidden>Detener</button>
<button class="b" id="gen">Nuevo arreglo</button><button class="b" id="shuf">Mezclar</button>
<label>Elementos <input type="range" id="n" min="10" max="100" value="50"><span class="mono" id="nv">50</span></label>
<label>Velocidad <input type="range" id="sp" min="1" max="100" value="70"></label></div>
<div class="stats"><div><b id="t">0.00 ms</b><span>Tiempo</span></div><div><b id="cm">0</b><span>Comparaciones</span></div><div><b id="sw">0</b><span>Intercambios</span></div></div>
<div class="learn"><div><h2 id="ln"></h2><p id="ld"></p><p class="tip" id="lt"></p></div>
<div><table><thead><tr><th>Algoritmo</th><th>Mejor</th><th>Promedio</th><th>Peor</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</section></main>
<footer><span>algO · proyecto de Said González</span><span>saidgonzalez.com</span></footer>
<script>
const D={
bubble:{n:'Bubble Sort',b:'n',a:'n²',w:'n²',d:'Compara vecinos y los intercambia si están al revés, así los valores más grandes flotan hasta el final.',t:'Intuitivo, pero muy lento con muchos datos.'},
selection:{n:'Selection Sort',b:'n²',a:'n²',w:'n²',d:'Busca el menor de la parte desordenada y lo coloca al inicio de la parte ordenada.',t:'Hace muy pocos intercambios comparado con otros métodos cuadráticos.'},
insertion:{n:'Insertion Sort',b:'n',a:'n²',w:'n²',d:'Toma cada valor nuevo y lo acomoda en su lugar dentro de la parte ya ordenada.',t:'Muy eficiente cuando el arreglo ya está casi ordenado.'},
gnome:{n:'Gnome Sort',b:'n',a:'n²',w:'n²',d:'Avanza si dos vecinos están en orden; si no, los intercambia y retrocede un paso.',t:'Funciona como Insertion Sort, pero con un solo índice.'},
exchange:{n:'Exchange Sort',b:'n²',a:'n²',w:'n²',d:'Compara el elemento actual con todos los siguientes e intercambia cuando encuentra uno menor.',t:'Fuerza bruta directa: fácil de entender.'},
quick:{n:'Quick Sort',b:'n log n',a:'n log n',w:'n²',d:'Elige un pivote y divide el arreglo en menores y mayores; luego repite en cada parte.',t:'De los más rápidos en la práctica con arreglos grandes.'},
merge:{n:'Merge Sort',b:'n log n',a:'n log n',w:'n log n',d:'Divide el arreglo a la mitad, ordena cada mitad y las combina.',t:'Siempre O(n log n), pero necesita memoria extra.'}};
const K=Object.keys(D);let cur='bubble',a=[],run=0,busy=false,st={c:0,s:0};
const $=id=>document.getElementById(id),bars=$('bars');
const cx=x=>x.includes('log')?'g':'a';
function draw(h={}){bars.innerHTML=a.map((v,i)=>`<div class="${h.o&&h.o.has(i)?'o':''} ${h.p===i?'p':h.s&&h.s.includes(i)?'s':h.c&&h.c.includes(i)?'c':''}" style="height:${v}%"></div>`).join('')}
function gen(){a=Array.from({length:+$('n').value},()=>8+Math.floor(Math.random()*92));reset();draw()}
function reset(){st={c:0,s:0};stats(0);$('status').textContent='Listo'}
function stats(ms){$('t').textContent=ms.toFixed(2)+' ms';$('cm').textContent=st.c;$('sw').textContent=st.s}
function pick(k){cur=k;const d=D[k];$('title').textContent=d.n;$('ln').textContent=d.n;$('ld').textContent=d.d;$('lt').textContent=d.t;
document.querySelectorAll('.alg').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
$('tb').innerHTML=K.map(x=>`<tr class="${x===k?'on':''}"><td>${D[x].n}</td><td class="m ${cx(D[x].b)}">O(${D[x].b})</td><td class="m ${cx(D[x].a)}">O(${D[x].a})</td><td class="m ${cx(D[x].w)}">O(${D[x].w})</td></tr>`).join('')}
$('list').innerHTML=K.map(k=>`<button class="alg" data-k="${k}" aria-pressed="false">${D[k].n}<small>O(${D[k].a})</small></button>`).join('');
document.querySelectorAll('.alg').forEach(b=>b.onclick=()=>{if(busy)return;pick(b.dataset.k);reset();draw()});
const wait=()=>new Promise(r=>setTimeout(r,Math.max(0,(101-$('sp').value)**1.6/8)));
async function algo(k,id,o,step){
const ok=()=>id===run,n=a.length;
const cmp=async(i,j,e={})=>{st.c++;step({c:[i,j],...e});await wait()};
const swp=async(i,j,e={})=>{[a[i],a[j]]=[a[j],a[i]];st.s++;step({s:[i,j],...e});await wait()};
if(k==='bubble'){for(let i=0;i<n-1&&ok();i++){for(let j=0;j<n-i-1&&ok();j++){await cmp(j,j+1);if(a[j]>a[j+1])await swp(j,j+1)}o.add(n-i-1)}}
else if(k==='selection'){for(let i=0;i<n-1&&ok();i++){let m=i;for(let j=i+1;j<n&&ok();j++){await cmp(m,j);if(a[j]<a[m])m=j}if(m!==i)await swp(i,m);o.add(i)}}
else if(k==='insertion'){for(let i=1;i<n&&ok();i++){let j=i;while(j>0&&ok()){await cmp(j-1,j);if(a[j-1]>a[j]){await swp(j-1,j);j--}else break}}}
else if(k==='gnome'){let i=0;while(i<n&&ok()){if(i===0){i++;continue}await cmp(i-1,i);if(a[i-1]<=a[i])i++;else{await swp(i-1,i);i--}}}
else if(k==='exchange'){for(let i=0;i<n-1&&ok();i++){for(let j=i+1;j<n&&ok();j++){await cmp(i,j);if(a[j]<a[i])await swp(i,j)}o.add(i)}}
else if(k==='quick'){const q=async(l,r)=>{if(l>=r||!ok()){if(l===r)o.add(l);return}const p=a[r];let i=l;for(let j=l;j<r&&ok();j++){await cmp(j,r,{p:r});if(a[j]<p){await swp(i,j,{p:r});i++}}await swp(i,r);o.add(i);await q(l,i-1);await q(i+1,r)};await q(0,n-1)}
else if(k==='merge'){const m=async(l,r)=>{if(l>=r||!ok())return;const mid=(l+r)>>1;await m(l,mid);await m(mid+1,r);const L=a.slice(l,mid+1),R=a.slice(mid+1,r+1);let i=0,j=0,x=l;while((i<L.length||j<R.length)&&ok()){if(j>=R.length||(i<L.length&&(st.c++,L[i]<=R[j])))a[x]=L[i++];else{if(i<L.length);a[x]=R[j++]}st.s++;step({s:[x]});await wait();x++}};await m(0,n-1)}
}
$('run').onclick=async()=>{if(busy)return;busy=true;const id=++run,o=new Set();$('run').hidden=true;$('stop').hidden=false;$('status').textContent='Ordenando';
const t0=performance.now();const step=h=>{stats(performance.now()-t0);draw({...h,o})};
await algo(cur,id,o,step);const ms=performance.now()-t0;
if(id===run){draw({o:new Set(a.keys())});stats(ms);$('status').textContent='Completado'}else $('status').textContent='Detenido';
busy=false;$('run').hidden=false;$('stop').hidden=true};
$('stop').onclick=()=>{run++};
$('gen').onclick=()=>{run++;setTimeout(gen,0)};
$('shuf').onclick=()=>{run++;setTimeout(()=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}reset();draw()},0)};
$('n').oninput=e=>{$('nv').textContent=e.target.value;if(!busy)gen()};
pick('bubble');gen();
</script></body></html>
